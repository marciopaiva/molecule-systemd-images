name: Build and Push Container Images

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday at 2 AM

env:
  REGISTRY: docker.io
  NAMESPACE: mpaivabarbosa

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: amazonlinux
            version: "2"
          - os: amazonlinux
            version: "2023"
          - os: centos
            version: "7"
          - os: centos
            version: "8"
          - os: rockylinux
            version: "8"
          - os: rockylinux
            version: "9"
          - os: rockylinux
            version: "10"
          - os: almalinux
            version: "8"
          - os: almalinux
            version: "9"
          - os: almalinux
            version: "10"
          - os: oraclelinux
            version: "8"
          - os: oraclelinux
            version: "9"
          - os: oraclelinux
            version: "10"
          - os: debian
            version: "9"
          - os: debian
            version: "10"
          - os: debian
            version: "11"
          - os: debian
            version: "12"
          - os: debian
            version: "13"
          - os: fedora
            version: "31"
          - os: fedora
            version: "32"
          - os: fedora
            version: "36"
          - os: fedora
            version: "37"
          - os: fedora
            version: "38"
          - os: fedora
            version: "39"
          - os: fedora
            version: "40"
          - os: fedora
            version: "41"
          - os: fedora
            version: "42"
          - os: fedora
            version: "43"
          - os: fedora
            version: "44"
          - os: ubuntu
            version: "18.04"
          - os: ubuntu
            version: "19.10"
          - os: ubuntu
            version: "20.04"
          - os: ubuntu
            version: "21.04"
          - os: ubuntu
            version: "22.04"
          - os: ubuntu
            version: "23.04"
          - os: ubuntu
            version: "24.04"
          - os: ubuntu
            version: "26.04"
          - os: opensuse
            version: "15.4"
          - os: opensuse
            version: "15.5"
          - os: opensuse
            version: "15.6"
          - os: opensuse
            version: "16.0"
          - os: archlinux
            version: "latest"

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Podman
      run: |
        sudo apt-get update
        sudo apt-get install -y podman

    - name: Log in to Registry
      if: github.event_name != 'pull_request'
      run: |
        echo "${{ secrets.REGISTRY_PASSWORD }}" | podman login ${{ env.REGISTRY }} -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

    - name: Build image
      run: |
        # Determine image path based on OS family
        if [[ "${{ matrix.os }}" =~ ^(amazonlinux|centos|rockylinux|almalinux|oraclelinux)$ ]]; then
          IMAGE_PATH="images/rhel-family/${{ matrix.os }}/${{ matrix.version }}"
        elif [[ "${{ matrix.os }}" =~ ^(debian|ubuntu)$ ]]; then
          IMAGE_PATH="images/debian-family/${{ matrix.os }}/${{ matrix.version }}"
        elif [[ "${{ matrix.os }}" == "fedora" ]]; then
          IMAGE_PATH="images/fedora/${{ matrix.version }}"
        elif [[ "${{ matrix.os }}" == "opensuse" ]]; then
          IMAGE_PATH="images/opensuse/${{ matrix.version }}"
        elif [[ "${{ matrix.os }}" == "archlinux" ]]; then
          IMAGE_PATH="images/archlinux/${{ matrix.version }}"
        fi
        
        cd "${IMAGE_PATH}"
        podman build -t ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/molecule-systemd-${{ matrix.os }}:${{ matrix.version }} .

    - name: Smoke test image
      run: |
        set -e
        IMAGE="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/molecule-systemd-${{ matrix.os }}:${{ matrix.version }}"
        CONTAINER="smoketest-${{ matrix.os }}-${{ matrix.version }}"

        podman run -d --name "$CONTAINER" --privileged \
          -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
          --tmpfs /tmp --tmpfs /run \
          "$IMAGE"

        echo "Waiting for systemd to report a status..."
        STATUS=""
        for i in $(seq 1 30); do
          STATUS=$(podman exec "$CONTAINER" systemctl is-system-running 2>/dev/null || true)
          echo "  [$i] systemctl is-system-running: ${STATUS:-<empty>}"
          if [ "$STATUS" = "running" ] || [ "$STATUS" = "degraded" ]; then
            break
          fi
          sleep 2
        done

        if [ "$STATUS" != "running" ] && [ "$STATUS" != "degraded" ]; then
          echo "::error::systemd on ${{ matrix.os }}:${{ matrix.version }} did not reach a ready state (last status: ${STATUS:-<none>})"
          podman logs "$CONTAINER" || true
          podman rm -f "$CONTAINER" || true
          exit 1
        fi
        echo "systemd is up ($STATUS)"

        echo "Checking passwordless sudo for the ansible user..."
        if ! podman exec "$CONTAINER" su - ansible -c "sudo -n whoami" | grep -qx root; then
          echo "::error::sudo -n whoami as ansible did not return root on ${{ matrix.os }}:${{ matrix.version }}"
          podman logs "$CONTAINER" || true
          podman rm -f "$CONTAINER" || true
          exit 1
        fi

        echo "Smoke test passed for $IMAGE"
        podman rm -f "$CONTAINER"

    - name: Scan image for vulnerabilities
      continue-on-error: true
      run: |
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
        podman save -o /tmp/image.tar ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/molecule-systemd-${{ matrix.os }}:${{ matrix.version }}
        trivy image --input /tmp/image.tar --severity HIGH,CRITICAL --exit-code 0
        rm -f /tmp/image.tar

    - name: Tag latest
      if: |
        (matrix.os == 'amazonlinux' && matrix.version == '2023') ||
        (matrix.os == 'rockylinux' && matrix.version == '10') ||
        (matrix.os == 'almalinux' && matrix.version == '10') ||
        (matrix.os == 'oraclelinux' && matrix.version == '10') ||
        (matrix.os == 'debian' && matrix.version == '13') ||
        (matrix.os == 'fedora' && matrix.version == '44') ||
        (matrix.os == 'ubuntu' && matrix.version == '26.04') ||
        (matrix.os == 'opensuse' && matrix.version == '16.0') ||
        (matrix.os == 'archlinux' && matrix.version == 'latest')
      run: |
        podman tag ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/molecule-systemd-${{ matrix.os }}:${{ matrix.version }} ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/molecule-systemd-${{ matrix.os }}:latest

    - name: Push image
      if: github.event_name != 'pull_request'
      run: |
        podman push ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/molecule-systemd-${{ matrix.os }}:${{ matrix.version }}
        if podman images --format "{{.Repository}}:{{.Tag}}" | grep -q "${{ env.REGISTRY }}/${{ env.NAMESPACE }}/molecule-systemd-${{ matrix.os }}:latest"; then
          podman push ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/molecule-systemd-${{ matrix.os }}:latest
        fi

    - name: Set README path
      if: github.event_name != 'pull_request' && (matrix.version == 'latest' || (matrix.os == 'amazonlinux' && matrix.version == '2023') || (matrix.os == 'rockylinux' && matrix.version == '10') || (matrix.os == 'almalinux' && matrix.version == '10') || (matrix.os == 'oraclelinux' && matrix.version == '10') || (matrix.os == 'debian' && matrix.version == '13') || (matrix.os == 'fedora' && matrix.version == '44') || (matrix.os == 'ubuntu' && matrix.version == '26.04') || (matrix.os == 'opensuse' && matrix.version == '16.0'))
      run: |
        if [ "${{ matrix.os }}" = "amazonlinux" ] || [ "${{ matrix.os }}" = "centos" ] || [ "${{ matrix.os }}" = "rockylinux" ] || [ "${{ matrix.os }}" = "almalinux" ] || [ "${{ matrix.os }}" = "oraclelinux" ]; then
          README_PATH="./images/rhel-family/${{ matrix.os }}/README.md"
        elif [ "${{ matrix.os }}" = "debian" ] || [ "${{ matrix.os }}" = "ubuntu" ]; then
          README_PATH="./images/debian-family/${{ matrix.os }}/README.md"
        elif [ "${{ matrix.os }}" = "fedora" ]; then
          README_PATH="./images/fedora/README.md"
        elif [ "${{ matrix.os }}" = "opensuse" ]; then
          README_PATH="./images/opensuse/README.md"
        elif [ "${{ matrix.os }}" = "archlinux" ]; then
          README_PATH="./images/archlinux/README.md"
        else
          README_PATH="./README.md"
        fi
        echo "README_PATH=$README_PATH" >> $GITHUB_ENV

    - name: Update Docker Hub description
      if: github.event_name != 'pull_request' && (matrix.version == 'latest' || (matrix.os == 'amazonlinux' && matrix.version == '2023') || (matrix.os == 'rockylinux' && matrix.version == '10') || (matrix.os == 'almalinux' && matrix.version == '10') || (matrix.os == 'oraclelinux' && matrix.version == '10') || (matrix.os == 'debian' && matrix.version == '13') || (matrix.os == 'fedora' && matrix.version == '44') || (matrix.os == 'ubuntu' && matrix.version == '26.04') || (matrix.os == 'opensuse' && matrix.version == '16.0'))
      uses: peter-evans/dockerhub-description@v4
      with:
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
        repository: ${{ env.NAMESPACE }}/molecule-systemd-${{ matrix.os }}
        short-description: "Systemd-enabled ${{ matrix.os }} container for Ansible Molecule testing with Python 3 and sudo user"
        readme-filepath: ${{ env.README_PATH }}
        enable-url-completion: true